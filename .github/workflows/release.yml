# Continuous delivery: runs when a version tag is pushed, e.g.
#   git tag v1.0.0 && git push origin v1.0.0
#
#   test     the full test suite must pass first
#   package  source archive attached to a GitHub Release (with generated notes)
#   image    Docker image pushed to GitHub Container Registry:
#            ghcr.io/<owner>/<repo>:<version>, :<major>.<minor>, :latest
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

  package:
    name: GitHub Release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/checkout@v4

      - name: Build source archive
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="filotrack-${GITHUB_REF_NAME}/" \
              --output="dist/filotrack-${GITHUB_REF_NAME}.zip" HEAD
          ls -l dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --title "FiloTrack $GITHUB_REF_NAME" \
              --generate-notes

  image:
    name: Container image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
