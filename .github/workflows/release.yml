# Continuous delivery: runs when a version tag is pushed, e.g.
#   git tag v1.0.0 && git push origin v1.0.0
#
#   test     the full test suite must pass first
#   package  source archive attached to a GitHub Release (with generated notes)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

  package:
    name: GitHub Release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/checkout@v7

      - name: Build source archive
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="filotrack-${GITHUB_REF_NAME}/" \
              --output="dist/filotrack-${GITHUB_REF_NAME}.zip" HEAD
          ls -l dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --title "FiloTrack $GITHUB_REF_NAME" \
              --generate-notes
